<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wykres 7 - Satysfakcja i Radość z WF</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        .chart-container {
            width: 100%;
            max-width: 1100px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .instruction {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            text-align: center;
            background: #e8f4f8;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #bce8f1;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div style="height: 550px;">
            <canvas id="myChart"></canvas>
        </div>
    </div>
    
    <p class="instruction">💡 <strong>Jak pobrać do pracy dyplomowej:</strong> Kliknij na wykres <strong>prawym przyciskiem myszy</strong> i wybierz <strong>"Zapisz grafikę jako..."</strong> (Save image as). Zapisany obraz będzie zawierał tytuł, pytanie oraz pełną legendę.</p>

    <script>
        // Rejestracja wtyczki do wyświetlania cyfr na słupkach
        Chart.register(ChartDataLabels);

        // Specjalny plugin gwarantujący białe tło podczas eksportu do PNG
        const customCanvasBackgroundColor = {
            id: 'customCanvasBackgroundColor',
            beforeDraw: (chart, args, options) => {
                const {ctx} = chart;
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = options.color || '#ffffff';
                ctx.fillRect(0, 0, chart.width, chart.height);
                ctx.restore();
            }
        };

        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                // Etykiety osi Y (grupy badawcze z podziałem na płeć)
                labels: [
                    'Klasa IV - Dziewczęta (n=14)',
                    'Klasa IV - Chłopcy (n=14)',
                    'Klasa VIII - Dziewczęta (n=15)',
                    'Klasa VIII - Chłopcy (n=14)'
                ],
                // Pełna, 5-stopniowa Skala Likerta w zbiorach danych
                datasets: [
                    {
                        label: 'Zdecydowanie tak',
                        data: [12, 11, 8, 8], // Sumy: 23 w kl IV, 16 w kl VIII
                        backgroundColor: '#1E3A8A', // Ciemny niebieski
                        borderRadius: 4
                    },
                    {
                        label: 'Raczej tak',
                        data: [2, 2, 4, 4], // Sumy: 4 w kl IV, 8 w kl VIII
                        backgroundColor: '#3B82F6', // Jasny niebieski
                        borderRadius: 4
                    },
                    {
                        label: 'Nie mam zdania',
                        data: [0, 1, 1, 2], // Sumy: 1 w kl IV, 3 w kl VIII
                        backgroundColor: '#9CA3AF', // Szary
                        borderRadius: 4
                    },
                    {
                        label: 'Raczej nie',
                        data: [0, 0, 1, 0], // Suma: 1 w kl VIII (Dziewczynka)
                        backgroundColor: '#F97316', // Pomarańczowy
                        borderRadius: 4
                    },
                    {
                        label: 'Zdecydowanie nie',
                        data: [0, 0, 1, 0], // Suma: 1 w kl VIII (Dziewczynka)
                        backgroundColor: '#DC2626', // Czerwony
                        borderRadius: 4
                    }
                ]
            },
            options: {
                indexAxis: 'y', // Wykres poziomy
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: { left: 10, right: 30, top: 10, bottom: 10 }
                },
                scales: {
                    x: {
                        stacked: true, 
                        max: 15, 
                        title: {
                            display: true,
                            text: 'Liczba oddanych głosów',
                            font: { size: 16, weight: 'bold' }
                        },
                        ticks: {
                            stepSize: 1,
                            font: { size: 14 }
                        }
                    },
                    y: {
                        stacked: true,
                        ticks: {
                            font: { size: 15, weight: 'bold' },
                            color: '#333'
                        }
                    }
                },
                plugins: {
                    customCanvasBackgroundColor: {
                        color: '#ffffff', 
                    },
                    // TYTUŁ WYKRESU BEZPOŚREDNIO NA OBRAZIE
                    title: {
                        display: true,
                        text: 'WYKRES 7. POZIOM SATYSFAKCJI I RADOŚCI CZERPANEJ Z LEKCJI WYCHOWANIA FIZYCZNEGO',
                        font: { size: 18, weight: 'bold', family: "'Segoe UI', Tahoma, sans-serif" },
                        color: '#2c3e50',
                        padding: { top: 10, bottom: 5 }
                    },
                    // PODTYTUŁ (PYTANIE Z ANKIETY) BEZPOŚREDNIO NA OBRAZIE
                    subtitle: {
                        display: true,
                        text: 'Pytanie: „Czy lekcje WF-u w Twojej szkole to dla Ciebie zazwyczaj przyjemność i okazja do dobrej zabawy?”',
                        font: { size: 15, style: 'italic', family: "'Segoe UI', Tahoma, sans-serif" },
                        color: '#7f8c8d',
                        padding: { bottom: 25 }
                    },
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 20,
                            font: { size: 14, weight: '500' },
                            usePointStyle: true, 
                            pointStyle: 'rectRounded'
                        }
                    },
                    datalabels: {
                        color: '#ffffff', 
                        font: {
                            size: 18,
                            weight: 'bold'
                        },
                        formatter: function(value, context) {
                            return value > 0 ? value : '';
                        }
                    },
                    tooltip: {
                        titleFont: { size: 15 },
                        bodyFont: { size: 15 }
                    }
                }
            },
            plugins: [customCanvasBackgroundColor]
        });
    </script>
</body>
</html>
